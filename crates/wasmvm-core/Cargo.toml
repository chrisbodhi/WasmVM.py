[package]
name = "wasmvm-core"
version = "0.1.0"
edition = "2021"
description = "Educational stack-based VM modeled on WebAssembly, compiled to Wasm for the browser."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

